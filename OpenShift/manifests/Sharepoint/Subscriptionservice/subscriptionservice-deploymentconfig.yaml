apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: subscriptionservice
  name: subscriptionservice
spec:
  replicas: 1
  selector:
    io.kompose.service: subscriptionservice
  template:
    metadata:
      labels:
        io.kompose.service: subscriptionservice
    spec:
      imagePullSecrets:
        - name: containgithubrepos
      containers:
        - env:
            - name: SHAREPOINT_WEBHOOK_URL
              value: "https://gangrenous-kandis-unmunched.ngrok-free.dev/api/WebHookListener"
            - name: SPRING_DATASOURCE_PASSWORD
              value: alfresco
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/contAInBallenbak
            - name: SPRING_DATASOURCE_USERNAME
              value: alfresco
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: create
            - name: SPRING_JPA_GENERATE_DDL
              value: "true"
          image: 'ghcr.io/rubenjunggithub/sharepoint-subscriptionservice:v1.0'
          imagePullPolicy: IfNotPresent
          name: subscriptionservice
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange