apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: migrationqueuepoller
  name: migrationqueuepoller
spec:
  replicas: 1
  selector:
    io.kompose.service: migrationqueuepoller
  template:
    metadata:
      labels:
        io.kompose.service: migrationqueuepoller
    spec:
      containers:
        - env:
            - name: SPRING_CONFIG_LOCATION
              value: /app/data/application.yaml
            - name: SPRING_DATASOURCE_PASSWORD
              value: alfresco
            - name: SPRING_DATASOURCE_USERNAME
              value: alfresco
            # 👇 Fixed to use internal OpenShift service 'postgres' instead of 'postgres-db'
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/contAInBallenbak
            - name: ACTIVEMQ_ALFRESCOSOURCE_BROKERURL
              value: tcp://activemq:61616
            - name: ACTIVEMQ_MIGRATIONHUB_BROKERURL
              value: tcp://activemq:61616
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb.contain-dvl.svc.cluster.local:27017/contAInBallenbak"
            # 👇 Ensures the baseurl property gets overridden inside the cluster
            - name: ILS_BASEURL
              value: "http://receiver.contain-dvl.svc.cluster.local:55500"
            - name: ILS_PROCESSSPITEMSENDPOINT
              value: "http://receiver.contain-dvl.svc.cluster.local:55500/api/ProcessChangedSharepointItem"
            - name: ILS_LOGIODELETEDFROMPLATFORMENDPOINT
              value: "http://receiver.contain-dvl.svc.cluster.local:55500/api/logiodeletedfromplatform"
          image: 'ghcr.io/rubenjunggithub/ilsqueuepollers-migrationqueuepoller:v1.0'
          name: migrationqueuepoller
          ports:
            - containerPort: 3003
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - migrationqueuepoller
        from:
          kind: ImageStreamTag
          name: migrationqueuepoller:latest
      type: ConfigChange
