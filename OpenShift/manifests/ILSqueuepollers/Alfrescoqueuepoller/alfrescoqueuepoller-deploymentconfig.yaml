apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: alfrescoqueuepoller
  name: alfrescoqueuepoller
spec:
  replicas: 1
  selector:
    io.kompose.service: alfrescoqueuepoller
  template:
    metadata:
      labels:
        io.kompose.service: alfrescoqueuepoller
    spec:
      imagePullSecrets:
        - name: containgithubrepos
      containers:
        - env:
            - name: SPRING_CONFIG_LOCATION
              value: /app/data/application.yaml
            - name: SPRING_DATASOURCE_PASSWORD
              value: alfresco
            - name: SPRING_DATASOURCE_USERNAME
              value: alfresco
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/contAInBallenbak
            - name: ACTIVEMQ_ALFRESCOSOURCE_BROKERURL
              value: tcp://activemq:61616
            - name: ACTIVEMQ_MIGRATIONHUB_BROKERURL
              value: tcp://activemq:61616
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb.contain-dvl.svc.cluster.local:27017/contAInBallenbak"
            - name: ILS_BASEURL
              value: "http://receiver.contain-dvl.svc.cluster.local:8080"
            - name: ILS_PROCESSALFRESCONODEPOINT
              value: "http://receiver.contain-dvl.svc.cluster.local:8080/api/ProcessChangedAlfrescoNode"
            - name: ILS_LOGIODELETEDFROMPLATFORMENDPOINT
              value: "http://receiver.contain-dvl.svc.cluster.local:8080/api/logiodeletedfromplatform"
            - name: ILS_RELOCATEENDPOINT
              value: "http://receiver.contain-dvl.svc.cluster.local:8080/api/MigrateIO"
            - name: ILS_RULEENGINECONTAINERENDPOINT
              value: "http://kie-server.contain-dvl.svc.cluster.local:8080/kie-server/services/rest/server"
            - name: ILS_RULEENGINEENDPOINT
              value: "http://kie-server.contain-dvl.svc.cluster.local:8080/kie-server/services/rest/server/containers/{CONTAINER_ID}/dmn"
            - name: ILS_RULEENGINEPROJECTNAME
              value: "contAlnMigrationRuleset"
          image: 'ghcr.io/rubenjunggithub/ilsqueuepollers-alfrescoqueuepoller:latest'
          imagePullPolicy: Always
          name: alfrescoqueuepoller
          ports:
            - containerPort: 5002
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - alfrescoqueuepoller
        from:
          kind: ImageStreamTag
          name: alfrescoqueuepoller:latest
      type: ImageChange