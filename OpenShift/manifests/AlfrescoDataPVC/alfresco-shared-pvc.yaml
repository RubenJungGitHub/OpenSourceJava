apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alfresco-shared-pvc
  namespace: contain-dvl
spec:
  accessModes:
    - ReadWriteOnce # Or ReadWriteMany if your storage class supports it and you have multiple pods
  resources:
    requests:
      storage: 5Gi
  # storageClassName: "your-storage-class" # Uncomment and specify if your cluster requires a specific one