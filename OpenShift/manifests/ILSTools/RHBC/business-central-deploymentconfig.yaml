apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: business-central
  name: business-central
  namespace: contain-dvl
spec:
  replicas: 1
  selector:
    io.kompose.service: business-central
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: business-central
    spec:
      initContainers:
        - name: init-wildfly-config
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          command:
            - "sh"
            - "-c"
            - |
              echo "Copying default standalone configuration and content..."
              cp -r /opt/jboss/wildfly/standalone/* /opt/jboss/wildfly-data/ 2>/dev/null || true
              
              echo "Fixing permissions for non-root execution..."
              chown -R 1000:0 /opt/jboss/wildfly-data || true
              chmod -R u+rwX /opt/jboss/wildfly-data || true
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: standalone-data
              mountPath: /opt/jboss/wildfly-data
      containers:
        - env:
            - name: JAVA_OPTS
              value: -Xms512m -Xmx2048m -Djava.net.preferIPv4Stack=true -Dorg.kie.demo=false -Dorg.kie.example=false -Dwildfly.undertow.support.proxy.address=true
            - name: KIE_ADMIN_PWD
              value: admin
            - name: KIE_ADMIN_USER
              value: admin
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          name: business-central
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8001
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: standalone-data
              mountPath: /opt/jboss/wildfly/standalone
      volumes:
        - name: standalone-data
          emptyDir: {}
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange