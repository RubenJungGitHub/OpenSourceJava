apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: mongodb
  name: mongodb
spec:
  replicas: 1
  selector:
    io.kompose.service: mongodb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mongodb
    spec:
      imagePullSecrets:
        - name: containgithubrepos   # <-- Updated here!
      containers:
        - env:
            - name: MONGO_INITDB_DATABASE
              value: ilstools
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: admin
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: TZ
              value: Europe/Amsterdam
          image: 'ghcr.io/rubenjunggithub/mongo:v1.0'
          imagePullPolicy: IfNotPresent
          name: mongo-db
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db
              name: mongo-storage
      restartPolicy: Always
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-storage
  test: false
  triggers:
    - type: ConfigChange