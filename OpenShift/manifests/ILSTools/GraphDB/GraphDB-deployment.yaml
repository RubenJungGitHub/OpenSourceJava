apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphdb
  namespace: contain-dvl
  labels:
    app: graphdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphdb
  template:
    metadata:
      labels:
        app: graphdb
    spec:
      imagePullSecrets:
        - name: alfrescoquayio
        - name: containgithubrepos
      containers:
        - name: graphdb
          image: 'ontotext/graphdb:10.6.2'
          imagePullPolicy: IfNotPresent
          env:
            - name: GDB_HEAP_SIZE
              value: "2G"
          resources:
            limits:
              cpu: '2'
              memory: 3Gi
            requests:
              cpu: 500m
              memory: 2Gi
          ports:
            - containerPort: 7200
              name: http
          volumeMounts:
            - name: graphdb-data
              mountPath: /opt/graphdb/home/data
            - name: graphdb-work
              mountPath: /opt/graphdb/home/work
            - name: graphdb-tmp
              mountPath: /opt/graphdb/home/tmp
            - name: graphdb-logs
              mountPath: /opt/graphdb/home/logs
      volumes:
        - name: graphdb-data
          persistentVolumeClaim:
            claimName: graphdb-pvc
        - name: graphdb-work
          emptyDir: {}
        - name: graphdb-tmp
          emptyDir: {}
        - name: graphdb-logs
          emptyDir: {}