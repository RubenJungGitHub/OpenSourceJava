apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-elasticsearch
  namespace: contain-dvl
  labels:
    app: elasticsearch
    role: Search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        role: Search   # <--- Voeg het label hier ook toe!
    spec:
      imagePullSecrets:
        - name: containgithubrepos
      containers:
        - name: elasticsearch
          image: ghcr.io/rubenjunggithub/ils-elasticsearchgeneric:latest
          imagePullPolicy: Always
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
            requests:
              memory: "2Gi"
              cpu: "1"
          env:
            - name: discovery.type
              value: "single-node"
            - name: ELASTIC_PASSWORD
              value: "admin"
            - name: xpack.security.enabled
              value: "true"
            - name: "ES_JAVA_OPTS"
              value: "-Xms2g -Xmx2g"
          ports:
            - containerPort: 9200
              name: http
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: es-pv-claim