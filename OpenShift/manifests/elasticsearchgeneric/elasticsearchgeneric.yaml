apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-elasticsearch
  namespace: contain-dvl
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # Nodig omdat het package op private staat in GitHub
      imagePullSecrets:
        - name: github-secret
      containers:
        - name: elasticsearch
          image: image: ghcr.io/rubenjunggithub/ils-elasticsearchgeneric:latest
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
            requests:
              memory: "2Gi"
              cpu: "1"
          env:
            - name: discovery.type
              value: "single-node"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-secrets
                  key: elastic-password
            - name: xpack.security.enabled
              value: "true"
            - name: "ES_JAVA_OPTS"
              value: "-Xms2g -Xmx2g"
          ports:
            - containerPort: 9200
              name: http
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: es-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-elasticsearch-svc
  namespace: search-system
spec:
  selector:
    app: elasticsearch
  ports:
    - protocol: TCP
      port: 9200
      targetPort: 9200
  type: ClusterIP