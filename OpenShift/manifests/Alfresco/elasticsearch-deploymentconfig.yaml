apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: elasticsearch
  name: elasticsearch
  namespace: contain-dvl
spec:
  replicas: 1
  selector:
    io.kompose.service: elasticsearch
  template:
    metadata:
      labels:
        io.kompose.service: elasticsearch
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000900000  # Allows file permissions to work inside the allowed OpenShift range
      containers:
        - env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
          image: 'elasticsearch:7.10.1'
          name: elasticsearch
          ports:
            - containerPort: 9200
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000900000  # Runs Elasticsearch as a non-root user within the allocated range
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: "2147483648"
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - elasticsearch
        from:
          kind: ImageStreamTag
          name: 'elasticsearch:7.10.1'
      type: ImageChange