apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: elasticsearch
  name: elasticsearch
spec:
  replicas: 1
  selector:
    io.kompose.service: elasticsearch
  template:
    metadata:
      labels:
        io.kompose.service: elasticsearch
    spec:
      containers:
        - env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
          image: ' '
          name: elasticsearch
          ports:
            - containerPort: 9200
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - elasticsearch
        from:
          kind: ImageStreamTag
          name: elasticsearch:7.10.1
      type: ImageChange
