apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: proxy
  name: proxy
spec:
  replicas: 1
  selector:
    io.kompose.service: proxy
  template:
    metadata:
      labels:
        io.kompose.service: proxy
    spec:
      containers:
        - image: ' '
          name: proxy
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              memory: "134217728"
          volumeMounts:
            - mountPath: /var/cache/nginx
              name: nginx-cache
            - mountPath: /var/run
              name: nginx-run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - proxy
        from:
          kind: ImageStreamTag
          name: proxy:3.4.2
      type: ImageChange