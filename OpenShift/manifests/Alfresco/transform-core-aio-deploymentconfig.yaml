apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: transform-core-aio
  name: transform-core-aio
spec:
  replicas: 1
  selector:
    io.kompose.service: transform-core-aio
  template:
    metadata:
      labels:
        io.kompose.service: transform-core-aio
    spec:
      containers:
        - env:
            - name: ACTIVEMQ_URL
              value: nio://activemq:61616
            - name: FILE_STORE_URL
              value: http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file
            - name: JAVA_OPTS
              value: -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
          image: ' '
          name: transform-core-aio
          ports:
            - containerPort: 8090
              protocol: TCP
          resources:
            limits:
              memory: "1610612736"
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - transform-core-aio
        from:
          kind: ImageStreamTag
          name: transform-core-aio:5.1.1
      type: ImageChange
