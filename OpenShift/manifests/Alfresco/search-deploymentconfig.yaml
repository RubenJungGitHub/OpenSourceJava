apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: search
  name: search
spec:
  replicas: 1
  selector:
    io.kompose.service: search
  template:
    metadata:
      labels:
        io.kompose.service: search
    spec:
      # --- ADD POD-LEVEL SECURITY CONTEXT ---
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - env:
            - name: ALFRESCO_ACCEPTED_CONTENT_MEDIA_TYPES_CACHE_BASE_URL
              value: http://transform-core-aio:8090/transform/config
            - name: ALFRESCO_SHAREDFILESTORE_BASEURL
              value: http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file/
            - name: SPRING_ACTIVEMQ_BROKERURL
              value: tcp://activemq:61616
            - name: SPRING_ELASTICSEARCH_REST_URIS
              value: http://elasticsearch:9200
          image: ' '
          name: search
          # --- ADD CONTAINER-LEVEL SECURITY CONTEXT ---
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0
          resources:
            limits:
              memory: "1073741824"
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - search
        from:
          kind: ImageStreamTag
          name: search:4.0.1
      type: ImageChange