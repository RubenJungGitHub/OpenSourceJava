apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: transform-router
  name: transform-router
spec:
  replicas: 1
  selector:
    io.kompose.service: transform-router
  template:
    metadata:
      labels:
        io.kompose.service: transform-router
    spec:
      containers:
        - env:
            - name: ACTIVEMQ_URL
              value: nio://activemq:61616
            - name: CORE_AIO_URL
              value: http://transform-core-aio:8090
            - name: FILE_STORE_URL
              value: http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file
            - name: JAVA_OPTS
              value: -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
          image: ' '
          name: transform-router
          ports:
            - containerPort: 8095
              protocol: TCP
          resources:
            limits:
              memory: "536870912"
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - transform-router
        from:
          kind: ImageStreamTag
          name: transform-router:4.1.1
      type: ImageChange
