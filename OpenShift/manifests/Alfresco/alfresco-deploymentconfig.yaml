apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: alfresco
  name: alfresco
spec:
  replicas: 1
  selector:
    io.kompose.service: alfresco
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: alfresco
    spec:
      imagePullSecrets:
        - name: alfrescoquayio
      securityContext:
        runAsUser: 0
        fsGroup: 0
      initContainers:
        - name: init-shared-pvc
          image: quay.io/alfresco/alfresco-content-repository:23.2.1
          command: ['sh', '-c']
          args:
            - |
              echo "Checking if shared PVC needs initialization..."
              if [ ! -f /mnt/shared/classes/alfresco/extension/keystore/keystore ]; then
                echo "Keystore not found in PVC. Copying default files from image..."
                mkdir -p /mnt/shared
                cp -a /usr/local/tomcat/shared/. /mnt/shared/
                echo "Initialization complete."
              else
                echo "Shared PVC already initialized. Skipping."
              fi
          volumeMounts:
            - mountPath: /mnt/shared
              name: alfresco-shared-volume
      containers:
        - env:
            - name: JAVA_OPTS
              value: -Ddb.driver=org.postgresql.Driver -Ddb.username=alfresco -Ddb.password=alfresco -Ddb.url=jdbc:postgresql://postgres:5432/alfresco -Dindex.subsystem.name=elasticsearch -Delasticsearch.createIndexIfNotExists=true -Delasticsearch.host=elasticsearch -Delasticsearch.port=9200 -Dshare.host=127.0.0.1 -Dshare.port=8080 -Dalfresco.host=localhost -Dalfresco.port=8080 -Dcsrf.filter.enabled=false -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true" -Ddeployment.method=DOCKER_COMPOSE -Dtransform.service.enabled=true -Dtransform.service.url=http://transform-router:8095 -Dsfs.url=http://shared-file-store:8099/ -DlocalTransform.core-aio.url=http://transform-core-aio:8090/ -Ddsync.service.uris=http://localhost:9090/alfresco -Dalfresco.readOnly=false -Drepository.readOnly=false -Dindex.recovery.mode=FULL -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80 -Dtransform.event.enabled=true
            - name: JAVA_TOOL_OPTIONS
              value: -Dencryption.keystore.type=JCEKS -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding -Dencryption.keyAlgorithm=DESede -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore -Dmetadata-keystore.password=mp6yc0UD9e -Dmetadata-keystore.aliases=metadata -Dmetadata-keystore.metadata.password=oKIWzVdEdA -Dmetadata-keystore.metadata.algorithm=DESede
          image: quay.io/alfresco/alfresco-content-repository:23.2.1
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-
            failureThreshold: 3
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 3
          name: alfresco
          ports:
            - containerPort: 2525
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              memory: "1992294400"
          volumeMounts:
            - mountPath: /usr/local/tomcat/alf_data
              name: alfresco-content-data
            - mountPath: /usr/local/tomcat/shared
              name: alfresco-shared-volume
      restartPolicy: Always
      volumes:
        - name: alfresco-content-data
          persistentVolumeClaim:
            claimName: alfresco-content-data
        - name: alfresco-shared-volume
          persistentVolumeClaim:
            claimName: alfresco-shared-pvc
  test: false
  triggers:
    - type: ConfigChange