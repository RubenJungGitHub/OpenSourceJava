apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: receiver
  name: receiver
spec:
  replicas: 1
  selector:
    io.kompose.service: receiver
  template:
    metadata:
      labels:
        io.kompose.service: receiver
    spec:
      imagePullSecrets:
        - name: containgithubrepos
      containers:
        - env:
            - name: APP_KEYSTORE_PATH
              value: /app/config/Containselfsigned_cert.p12
            - name: SPRING_CONFIG_LOCATION
              value: /app/data/application.yaml
            - name: SPRING_DATASOURCE_PASSWORD
              value: alfresco
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-db:5432/contAInBallenbak
            - name: SPRING_DATASOURCE_USERNAME
              value: alfresco
            - name: SPRING_REDIS_HOST
              value: Redis-service
          image: 'ghcr.io/rubenjunggithub/ils-receiver:v1.0'
          imagePullPolicy: IfNotPresent
          name: receiver
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange