apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: receiver
  name: receiver
  namespace: contain-dvl
spec:
  replicas: 1
  selector:
    io.kompose.service: receiver
  template:
    metadata:
      labels:
        io.kompose.service: receiver
    spec:
      imagePullSecrets:
        - name: containgithubrepos
      containers:
        - env:
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
            - name: SPRING_CONFIG_LOCATION
              value: optional:file:/app/data/application.yaml
            - name: ALFRESCO_BASEURL
              value: "https://alfresco-proxy-route-contain-dvl.apps.ocp0.anders-nogic.atos.net/"
            - name: ALFRESCO_USERNAME
              value: "admin"
            - name: ALFRESCO_PASSWORD
              value: "admin"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: APP_KEYSTORE_PATH
              value: /app/config/Containselfsigned_cert.p12
            - name: SPRING_DATASOURCE_PASSWORD
              value: alfresco
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-db:5432/contAInBallenbak
            - name: SPRING_DATASOURCE_USERNAME
              value: alfresco
            - name: SPRING_REDIS_HOST
              value: redis
            - name: ILS_RULEENGINECONTAINERENDPOINT
              value: "http://kie-server.contain-dvl.svc.cluster.local:8080/kie-server/services/rest/server"
            - name: ILS_RULEENGINEENDPOINT
              value: "http://kie-server.contain-dvl.svc.cluster.local:8080/kie-server/services/rest/server/containers/{CONTAINER_ID}/dmn"
            - name: ILS_RULEENGINEUSERNAME
              value: admin
            - name: ILS_RULEENGINEPASSWORD
              value: admin
            - name: SPRING_DATA_MONGODB_HOST
              value: mongodb
            - name: SPRING_DATA_MONGODB_PORT
              value: "27017"
            - name: SPRING_DATA_MONGODB_DATABASE
              value: ilstools
            - name: SPRING_DATA_MONGODB_USERNAME
              value: admin
            - name: SPRING_DATA_MONGODB_PASSWORD
              value: admin
            - name: SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE
              value: admin
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://admin:admin@mongodb:27017/ilstools?authSource=admin
            - name: ILS_UUDIUTILENDPOINT
              value: "http://uuidutil-service:5002/api/GetUUID"
            - name: ILS_BASEURL
              value: "http://receiver:55500"
            - name: ILS_BINDENDPOINT
              value: "http://receiver:55500/api/Bind"
            - name: ILS_TAXONOMYSERVICEENDPOINT
              value: "https://taxonomyservice:53000/api"
            - name: ILS_RULEENGINEMOVEENDPOINT
              value: "http://receiver:55500/api/rules"
            - name: ILS_RULEENGINEPROJECTNAME
              value: "com.myspace:contAlnMigrationRuleset"
            - name: ILS_DELTALINKFILE
              value: "/app/data/storeddeltalinks.csv"
          image: 'ghcr.io/rubenjunggithub/ils-receiver:v1.0'
          imagePullPolicy: Always
          name: receiver
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data
              name: receiver-data
      volumes:
        - name: receiver-data
          emptyDir: {}
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange