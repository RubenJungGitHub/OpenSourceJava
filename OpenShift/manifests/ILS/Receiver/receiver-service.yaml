apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: receiver
  name: receiver
  namespace: contain-dvl
spec:
  ports:
  - name: "8080"
    port: 8080
    protocol: TCP
    targetPort: 8080
  # (Optional: you can keep port 55500 as a second entry in the ports array if other things still rely on it)
  selector:
    io.kompose.service: receiver
  type: ClusterIP