apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: taxonomycacher
  name: taxonomycacher
  namespace: contain-dvl
spec:
  replicas: 1
  selector:
    io.kompose.service: taxonomycacher
  template:
    metadata:
      labels:
        io.kompose.service: taxonomycacher
    spec:
      containers:
        - env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongodb:27017/tbl_iolog
          image: 'ghcr.io/rubenjunggithub/ils-taxonomycacher:v1.0'
          name: taxonomycacher
          ports:
            - containerPort: 60000
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange