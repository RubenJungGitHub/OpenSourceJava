apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: taxonomyservice
  name: taxonomyservice
  namespace: contain-dvl
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: taxonomyservice
  template:
    metadata:
      labels:
        io.kompose.service: taxonomyservice
    spec:
      imagePullSecrets:
        - name: alfrescoquayio
        - name: containgithubrepos
      containers:
        - name: taxonomyservice
          image: 'ghcr.io/rubenjunggithub/ils-taxonomy-service-ssl:v1.0'
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: VOCBENCH_BASE_URL
              value: http://vocbench:1979
            - name: VOCBENCH_PASSWORD
              value: admin
            - name: VOCBENCH_USER
              value: admin@vocbench.com
          ports:
            - containerPort: 53000
              protocol: TCP
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
      restartPolicy: Always