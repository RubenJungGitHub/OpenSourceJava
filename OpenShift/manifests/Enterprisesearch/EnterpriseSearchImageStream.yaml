apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  labels:
    io.kompose.service: enterprise-search
  name: enterprise-search
spec:
  lookupPolicy:
    local: true
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: ghcr.io/rubenjunggithub/enterprise-search:latest
      importPolicy:
        scheduled: true