#debug: true
name: ils
spring:
  profiles:
    active: sp

  flyway:
      enabled: false

  # ---------- Redis ----------
  data:
    redis:
      host: ${SPRING_REDIS_HOST:Redis-service}
      port: ${SPRING_REDIS_PORT:8001}
      password: ""

  # ---------- SQL DataSource ----------
# datasource:
 #   url: jdbc:sqlserver://localhost:1433;databaseName=contAInBallenbak;encrypt=false;trustServerCertificate=true
 #   username: sa
 #   password: contAIn123!
