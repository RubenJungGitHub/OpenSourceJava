 #------------PostGress datasource -------------
  datasource:
    url: jdbc:postgresql://localhost:5433/contAInBallenbak
    username: contain
    password: contain
    driver-class-name: org.postgresql.Driver
    idle-timeout: 30000          # 30 seconds
    max-lifetime: 1800000        # 30 minutes
    connection-timeout: 30000    # 30 seconds
    leak-detection-threshold: 20000  # 20 seconds

  jpa:
    hibernate:
      ddl-auto: update   # or create / create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

