
# ==========================
# Spring Boot Configuration
# ==========================

name: ils

#debug: true

spring:
  redis:
    host: Redis-service
    port: 6379
  
  # ---------- Mongo DataSource ----------
  data:
    mongodb:
      uri: mongodb://admin:admin@mongo_db:27017/ilstools?authSource=admin

  
  datasource:
 #------------PostGress datasource -------------
    url: jdbc:postgresql://postgres-db:5432/contAInBallenbak
    username: contain
    password: contain
    driver-class-name: org.postgresql.Driver
    idle-timeout: 30000          # 30 seconds
    max-lifetime: 1800000        # 30 minutes
    connection-timeout: 30000    # 30 seconds
    leak-detection-threshold: 20000  # 20 seconds\
  jpa:
    hibernate:
      ddl-auto: update   # or create / create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
# ==========================
# Custom Application Properties
# ==========================


activemq:
  brokerUrl: tcp://end-user-activemq-1:61616
  user: admin
  password: admin
  sharepoint-queue: sharepoint.delta.queue
  alfresco-queue: Consumer.MyJavaConsumer.VirtualTopic.alfresco.repo.events.nodes


app:
  keystore:
    path: /app/config/Containselfsigned_cert.p12

alfresco:
  username: admin
  password: admin
  baseUrl: http://end-user-alfresco-1:8080
  

mongodb:
      uri: mongodb://admin:admin@127.0.0.1:27017/ilstools?authSource=admin
      

ils:
  #username: admin
  #password: admin
  uudiutilendpoint: http://ils-uuidutil-1:5002/api/GetUUID
  base-url: http://receiver:8080
  bindendpoint: http://receiver:8080/api/Bind
  relocateendpoint: http://receiver:8080/RelocateIO
  ruleenginecontainerendpoint: http://localhost:8180/kie-server/services/rest/server/containers
