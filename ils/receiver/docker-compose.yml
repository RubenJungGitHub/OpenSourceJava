
name : ils
services:
  receiver:
    build:
      context: D:/Contain/OpenSourceJava/ils
      dockerfile: receiver/Dockerfile
    container_name: receiver
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/contAInBallenbak
      SPRING_DATASOURCE_USERNAME: contain
      SPRING_DATASOURCE_PASSWORD: contain
      SPRING_CONFIG_LOCATION: /app/data/application.yaml
      APP_KEYSTORE_PATH: /app/config/Containselfsigned_cert.p12
      SPRING_REDIS_HOST: Redis-service
    ports:
      - "55500:8080"
    networks:
      - ils_ils_default
      - developer_default


networks:
  ils_ils_default:
    external: true
  developer_default:
    external: true