    leak-detection-threshold: 20000  # 20 seconds\
  jpa:
    hibernate:
      ddl-auto: update   # or create / create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
