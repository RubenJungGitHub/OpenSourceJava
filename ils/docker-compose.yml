services:
  redis:
    image: redis/redis-stack:latest
    container_name: Redis-service
    ports:
    - "6379:6379"
    - "8001:8001"
    networks:
    - ils-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: contain
      POSTGRES_PASSWORD: contain
      POSTGRES_DB: contAInBallenbak  # <-- the database Spring Boot will use
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ils-default

  contain-ils:
    build: .
    container_name: contain-ils
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contAInBallenbak
      SPRING_DATASOURCE_USERNAME: contain
      SPRING_DATASOURCE_PASSWORD: contain
      SPRING_CONFIG_LOCATION: /app/data/application.yaml
      APP_KEYSTORE_PATH: /app/config/Containselfsigned_cert.p12
      SPRING_REDIS_HOST: Redis-service
    ports:
      - "5000:8080"
    networks:
      - ils-default
      - end-user_default


volumes:
  pgdata:

networks:
  ils-default:
    driver: bridge

  end-user_default:
    external: true

